<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAY CHAMPIONS 2026</title><style>
body{margin:0;background:#080d1b;color:#fff;font-family:Arial}header{text-align:center;padding:28px;background:#142654;border-bottom:2px solid #28d7ff}nav{display:flex;gap:6px;padding:8px;background:#11182b;overflow:auto;position:sticky;top:0}button{padding:10px 14px;border:0;border-radius:7px;background:#243251;color:#fff}.active{background:#1678ff}main{max-width:1050px;margin:auto;padding:16px}.box{background:#121b31;border:1px solid #293858;border-radius:10px;padding:14px;margin-bottom:12px}.match{display:grid;grid-template-columns:45px 1fr 65px 1fr 80px;gap:8px;align-items:center;padding:10px;margin:6px 0;background:#18233d;border-radius:8px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #293858;text-align:center}td:nth-child(2){text-align:left;font-weight:bold}th{color:#7fe7ff;background:#1d2945}@media(max-width:650px){.match{grid-template-columns:35px 1fr 48px 1fr 62px;font-size:11px}}
</style></head><body><header><h1>🏆 CAY CHAMPIONS 2026</h1><p>eFootball Tournament</p></header><nav><button class="active" onclick="show('home',this)">HOME</button><button onclick="show('matches',this)">JADWAL</button><button onclick="show('groups',this)">KLASEMEN</button><button onclick="show('players',this)">PESERTA</button><button onclick="location.href='admin.html'">ADMIN</button></nav><main>
<section id="home"><div class="box"><h2>Match Center</h2><p>31 Peserta • 45 Pertandingan • 8 Grup</p></div></section>
<section id="matches" style="display:none"><div class="box"><h2>📅 Jadwal & Hasil</h2><div id="ml"></div></div></section>
<section id="groups" style="display:none"><div class="box"><h2>📊 Klasemen</h2><div class="tabs" id="gt"></div><div id="st"></div></div></section>
<section id="players" style="display:none"><div class="box"><h2>👤 Peserta</h2><div id="pl"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const G={A:["KunTheMaestro","valni30","Catraw_aw","Neptunus FC"],B:["Tt_y_o_l_o__12","gwmaudiv1","ONIC-SKYLER-PRO","Bangmenhon"],C:["SULLIVAN","Exca gank","ihtakutnyeee","g_41"],D:["SKUYYYAH","Musblan","Puhai_79","KAIRELBARRA"],E:["MAJENE01","ambaautukaam","dudun2109","EGA111"],F:["wild_an14","BONJOVIIII","ZQ_Ocean","muhijaya"],G:["ggaming","PJOKOWI","Luksky_ya","kinglambee12"],H:["ksnsjuah","kijanggg_pb","Mrkaret"]};let A=[],cur="A";
function show(id,b){document.querySelectorAll("main section").forEach(x=>x.style.display="none");document.getElementById(id).style.display="block";document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function matches(){ml.innerHTML=A.map(m=>`<div class=match><b>#${m.match_number}<small>${m.group_name}</small></b><div>${m.player1}</div><b>${m.score1??"-"} - ${m.score2??"-"}</b><div>${m.player2}</div><span>${m.status}</span></div>`).join("")}
function tabs(){gt.innerHTML=Object.keys(G).map(g=>`<button class="${g==cur?'active':''}" onclick="cur='${g}';tabs();stand()">${g}</button>`).join("")}
function stand(){let s={};G[cur].forEach(p=>s[p]={m:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});A.filter(m=>m.group_name==cur&&m.score1!=null&&m.score2!=null).forEach(m=>{let a=+m.score1,b=+m.score2,x=s[m.player1],y=s[m.player2];x.m++;y.m++;x.gf+=a;x.ga+=b;y.gf+=b;y.ga+=a;if(a>b){x.w++;x.pts+=3;y.l++}else if(a<b){y.w++;y.pts+=3;x.l++}else{x.d++;y.d++;x.pts++;y.pts++}});let r=Object.entries(s).map(([p,v])=>({p,...v,gd:v.gf-v.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);st.innerHTML=`<h3>GRUP ${cur}</h3><table><tr><th>#</th><th>PLAYER</th><th>M</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.p}</td><td>${x.m}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd}</td><td><b>${x.pts}</b></td></tr>`).join("")}</table>`}
function players(){pl.innerHTML=Object.entries(G).map(([g,p])=>`<div class=box><b>GRUP ${g}</b><p>${p.join(" • ")}</p></div>`).join("")}
async function load(){let r=await supabaseClient.from("matches").select("*").order("match_number");if(r.error){ml.innerHTML="<p>Hubungkan config.js ke Supabase terlebih dahulu.</p>";return}A=r.data;matches();tabs();stand();players()}
load();
</script></body></html>
