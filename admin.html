<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin CAY CHAMPIONS</title><style>
body{margin:0;background:#080d1b;color:#fff;font-family:Arial}header{text-align:center;padding:22px;background:#142654;border-bottom:2px solid #28d7ff}main{max-width:1100px;margin:auto;padding:16px}.box{background:#121b31;border:1px solid #293858;border-radius:10px;padding:15px;margin-bottom:12px}input,select{background:#080d1b;color:#fff;border:1px solid #42527a;border-radius:6px;padding:8px;width:70px}input[type=email],input[type=password]{width:100%;margin:5px 0 10px}.match{display:grid;grid-template-columns:40px 1fr 65px 65px 1fr 100px;gap:7px;align-items:center;background:#18233d;padding:9px;margin:6px 0;border-radius:8px}button{padding:9px 13px;border:0;border-radius:7px;background:#1678ff;color:#fff}@media(max-width:650px){.match{grid-template-columns:30px 1fr 48px 48px 1fr 70px;font-size:11px}input,select{width:45px}}
</style></head><body><header><h1>👑 ADMIN CAY CHAMPIONS 2026</h1></header><main><div id=login class=box><h2>Login Admin</h2><input id=email type=email placeholder="Email admin"><input id=password type=password placeholder="Password"><button onclick=login()>LOGIN</button><p id=msg></p></div><div id=panel style="display:none"><div class=box><span id=who></span> <button onclick=logout()>LOGOUT</button></div><div class=box><h2>⚽ Edit Skor</h2><div id=matches></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
async function login(){let r=await supabaseClient.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){msg.textContent=r.error.message;return}check()}
async function check(){let r=await supabaseClient.auth.getUser();let u=r.data.user;if(!u){return}let q=await supabaseClient.from("admin_users").select("user_id").eq("user_id",u.id).maybeSingle();if(!q.data){await supabaseClient.auth.signOut();msg.textContent="Akun bukan admin.";return}login.style.display="none";panel.style.display="block";who.textContent="Login: "+u.email;load()}
async function load(){let r=await supabaseClient.from("matches").select("*").order("match_number");matches.innerHTML=r.data.map(m=>`<div class=match><b>#${m.match_number}</b><div>${m.player1}<small> Grup ${m.group_name}</small></div><input id=a${m.id} type=number min=0 value="${m.score1??''}"><input id=b${m.id} type=number min=0 value="${m.score2??''}"><div>${m.player2}</div><div><select id=s${m.id}><option ${m.status=="UPCOMING"?"selected":""}>UPCOMING</option><option ${m.status=="LIVE"?"selected":""}>LIVE</option><option ${m.status=="FINISHED"?"selected":""}>FINISHED</option></select><button onclick="save(${m.id})">SIMPAN</button></div></div>`).join("")}
async function save(id){let x=document.getElementById("a"+id).value,y=document.getElementById("b"+id).value,s=document.getElementById("s"+id).value;if(x!==""&&y!=="")s="FINISHED";let r=await supabaseClient.from("matches").update({score1:x===""?null:+x,score2:y===""?null:+y,status:s}).eq("id",id);if(r.error)alert(r.error.message);else load()}
async function logout(){await supabaseClient.auth.signOut();location.reload()}check();
</script></body></html>
